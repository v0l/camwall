name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: package
        run: |
          name=camwall-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux
          mkdir $name
          cp target/release/camwall README.md LICENSE $name/
          cp -r dist $name/
          tar czf $name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: camwall-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" camwall-*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
